[package]
name = "fde"
version = "1.1.1"
edition = "2024"
authors = ["0xtaruhi"]
description = "Standalone Rust implementation flow for FDE"
license = "MIT"
repository = "https://github.com/0xtaruhi/fde-rs"
homepage = "https://github.com/0xtaruhi/fde-rs"
readme = "README.md"
default-run = "fde"

[dependencies]
anyhow = "1.0"
arrayvec = "0.7"
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.12"
roxmltree = "0.21"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
smallvec = "1.15"
thiserror = "2.0"
rustc-hash = "2.1"

[dev-dependencies]
tempfile = "3.15"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
